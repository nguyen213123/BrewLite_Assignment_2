<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6d4c3d" />
    <title>Bạn đang offline · BrewLite</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #faf6ec; color: #4a2e20;
      }
      main {
        width: 100%; max-width: 420px; text-align: center; background: #fff;
        border: 1px solid #decbb4; border-radius: 24px; padding: 32px 24px;
        box-shadow: 0 4px 16px rgba(74, 46, 32, 0.08);
      }
      .icon {
        width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%;
        display: grid; place-items: center; font-size: 34px; background: #cbe8d3;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 12px; font-size: 14px; line-height: 1.55; color: #7a6254; }
      .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
      button, a.btn {
        min-height: 46px; display: inline-flex; align-items: center; justify-content: center;
        border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer;
      }
      button { background: #6d4c3d; color: #fff; border: 0; }
      a.btn { background: #efe5d4; color: #4a2e20; border: 1px solid #decbb4; }
      .note { margin-top: 16px; font-size: 12px; }
    </style>
  </head>
  <body>
    <main role="main">
      <div class="icon" aria-hidden="true">☕</div>
      <h1>Bạn đang offline</h1>
      <p>BrewLite cần kết nối mạng để xem thực đơn, đặt đơn và thanh toán. Hãy kiểm tra Wi‑Fi hoặc dữ liệu di động rồi thử lại.</p>
      <p class="note">Giỏ hàng được lưu trên thiết bị của bạn. Không có đơn hàng hay khoản thanh toán nào được gửi khi bạn đang offline.</p>
      <div class="actions">
        <button type="button" id="retry">Thử lại</button>
        <a class="btn" href="/">Về trang chủ</a>
      </div>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () { location.reload(); });
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
